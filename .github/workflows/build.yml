# Baut whisper.cpp aus dem offiziellen Quellcode mit Vulkan für Windows (AMD- und Intel-Grafik).
# Das offizielle Projekt liefert für Windows nur CPU- und CUDA-Builds. Jedes Release enthält eine
# SHA-256-Prüfsumme, mit der Programme den Download prüfen können.
name: whisper.cpp mit Vulkan (Windows)

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build.yml']

env:
  WHISPER_TAG: v1.9.5
  VULKAN_VERSION: 1.4.357.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: whisper.cpp holen
        uses: actions/checkout@v5
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_TAG }}
          path: whisper.cpp

      - name: Vulkan SDK installieren
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Bauen
        working-directory: whisper.cpp
        run: |
          cmake -B build -DGGML_VULKAN=ON -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF `
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON `
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build --config Release -j 4 --target whisper-cli

      - name: Paket schnüren
        shell: pwsh
        run: |
          $out = "whisper-vulkan-win-x64"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item whisper.cpp/build/bin/Release/whisper-cli.exe $out/
          Copy-Item whisper.cpp/samples/jfk.wav $out/
          Copy-Item whisper.cpp/LICENSE $out/LICENSE-whisper.cpp.txt
          "whisper.cpp $env:WHISPER_TAG, Vulkan SDK $env:VULKAN_VERSION, gebaut von GitHub Actions ($env:GITHUB_SHA)" | Set-Content $out/BUILD.txt
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
          (Get-FileHash "$out.zip" -Algorithm SHA256).Hash.ToLower() | Set-Content "$out.zip.sha256" -NoNewline
          Get-Content "$out.zip.sha256"

      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "whisper-vulkan-$env:WHISPER_TAG"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          gh release create $tag whisper-vulkan-win-x64.zip whisper-vulkan-win-x64.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "whisper.cpp $env:WHISPER_TAG mit Vulkan (Windows x64)" `
            --notes "Unveränderter Quellcode von ggml-org/whisper.cpp $env:WHISPER_TAG, gebaut mit Vulkan für AMD- und Intel-Grafik. MIT-Lizenz."
